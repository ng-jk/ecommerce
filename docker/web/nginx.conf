server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    location / { try_files $uri $uri/ /index.html; }
    location /_expo/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /shop3i-runtime.json { add_header Cache-Control "no-store"; }
    location = /shop3i-profile.json { try_files $uri =404; add_header Cache-Control "no-store"; }
}
