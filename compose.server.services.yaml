# Server-only overlay. Generate SERVICE_RUNTIME_DIR using tools/service_release.py.
# Each domain receives one private env file; no foreign database credentials.
x-service-volumes: &service-volumes
  - ${SERVICE_RUNTIME_DIR:?Prepare service runtime}/certificates/ca.crt:/certificates/ca.crt:ro
  - ./docker/services/trust.ini:/usr/local/etc/php/conf.d/zz-service-trust.ini:ro
services:
  backend:
    env_file: ["${SERVICE_RUNTIME_DIR:?Prepare service runtime}/platform.env"]
    networks: [application, supabase, service_transport]
    volumes: *service-volumes
  worker:
    env_file: ["${SERVICE_RUNTIME_DIR:?Prepare service runtime}/platform.env"]
    networks: [application, supabase, service_transport]
    volumes: *service-volumes
  service-worker:
    extends:
      file: compose.server.yaml
      service: worker
    command: [php, -d, memory_limit=64M, artisan, services:work]
    env_file: ["${SERVICE_RUNTIME_DIR:?Prepare service runtime}/platform.env"]
    networks: [application, supabase, service_transport]
    volumes: *service-volumes
    mem_limit: 96m
    pids_limit: 24
    restart: unless-stopped
  crm:
    image: ${APP_IMAGE_PREFIX:-shop3i}/backend:${RELEASE_ID:?Set verified release}
    user: www-data
    env_file: ["${SERVICE_RUNTIME_DIR:?Prepare service runtime}/crm.env"]
    command: [php-fpm, -d, memory_limit=64M]
    networks: [supabase, service_transport]
    volumes:
      - ${SERVICE_RUNTIME_DIR:?Prepare service runtime}/certificates/ca.crt:/certificates/ca.crt:ro
      - ./docker/services/trust.ini:/usr/local/etc/php/conf.d/zz-service-trust.ini:ro
      - ${SERVICE_RUNTIME_DIR:?Prepare service runtime}/pool.conf:/usr/local/etc/php-fpm.d/zz-service-pool.conf:ro
    mem_limit: 128m
    pids_limit: 24
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 40s
    restart: unless-stopped
  crm-worker:
    image: ${APP_IMAGE_PREFIX:-shop3i}/backend:${RELEASE_ID:?Set verified release}
