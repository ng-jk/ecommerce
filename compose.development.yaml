x-expo-volumes: &expo-volumes
  - .:/app
  - node_modules:/app/node_modules
services:
  backend:
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
  worker:
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
  fashion:
    build:
      dockerfile: docker/web/Dockerfile.development
    command: [npm, run, web, --workspace=@portfolio/fashion, --, --host, lan]
    volumes: *expo-volumes
    environment: {EXPO_NO_TELEMETRY: "1"}
    ports: ["8081:8081"]
  electronics:
    build:
      dockerfile: docker/web/Dockerfile.development
    command: [npm, run, web, --workspace=@portfolio/electronics, --, --host, lan]
    volumes: *expo-volumes
    environment: {EXPO_NO_TELEMETRY: "1"}
    ports: ["8082:8082"]
  admin:
    build:
      dockerfile: docker/web/Dockerfile.development
    command: [npm, run, web, --workspace=@portfolio/admin, --, --host, lan]
    volumes: *expo-volumes
    environment: {EXPO_NO_TELEMETRY: "1"}
    ports: ["8083:8083"]
  gateway:
    volumes:
      - ./docker/Caddyfile.development:/etc/caddy/Caddyfile:ro
volumes:
  node_modules:
  backend_vendor:
